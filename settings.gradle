pluginManagement {
    includeBuild("build-logic")
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
rootProject.name = "TravelCompanion"
include ':app'
include ':core:common'
include ':core:network'
include ':core:data'
include ':feature:lens'
include ':feature:transit'
include ':feature:dining'
include ':feature:phrasebook'
include ':feature:tourism'
include ':feature:meter'
